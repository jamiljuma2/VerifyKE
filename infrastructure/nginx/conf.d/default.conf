# VerifyKE virtual hosts: the web application and the API on one origin.
#
# Host routing keeps cookies first-party (SameSite=Strict) without loosening
# CORS: /api and /verify are proxied to FastAPI, everything else to Next.js.

upstream verifyke_api {
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream verifyke_web {
    server web:3000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # Security headers are also set by the API middleware; repeating them here
    # covers static assets served directly by Next.js.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=()" always;

    # ------------------------------------------------------------------ API
    location /api/ {
        limit_req zone=public_api burst=60 nodelay;
        proxy_pass http://verifyke_api;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Public verification endpoints (QR scans and manual lookups) get their own
    # tighter bucket because they are unauthenticated.
    location /verify {
        limit_req zone=verification burst=20 nodelay;
        proxy_pass http://verifyke_api;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location = /openapi.json { proxy_pass http://verifyke_api; include /etc/nginx/conf.d/proxy_params.conf; }
    location /docs        { proxy_pass http://verifyke_api; include /etc/nginx/conf.d/proxy_params.conf; }
    location /redoc       { proxy_pass http://verifyke_api; include /etc/nginx/conf.d/proxy_params.conf; }

    # Health and readiness are consumed by the load balancer / orchestrator.
    location = /health { proxy_pass http://verifyke_api; include /etc/nginx/conf.d/proxy_params.conf; }
    location = /ready  { proxy_pass http://verifyke_api; include /etc/nginx/conf.d/proxy_params.conf; }

    # Metrics are never public: they leak internal volume and cardinality.
    location = /metrics {
        deny all;
        return 404;
    }

    # ------------------------------------------------------------------ web app
    location / {
        proxy_pass http://verifyke_web;
        include /etc/nginx/conf.d/proxy_params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
