# VerifyKE ingress.
#
# TLS termination belongs here in production: mount the certificate (for example
# from Let's Encrypt certbot) and enable the https server block in
# conf.d/default.conf. Only port 80 is exposed by the shipped Compose file.

user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;              # never advertise the nginx version

    client_max_body_size 12m;       # slightly above VK_UPLOAD_MAX_BYTES
    client_body_timeout 30s;
    client_header_timeout 15s;
    reset_timedout_connection on;

    # The application emits structured access logs; nginx records the transport
    # level view, including the request id it forwarded upstream.
    log_format verifyke escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log verifyke;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Coarse, network-level abuse protection in front of the application's own
    # Redis-backed limiter (which is per-account and per-route).
    limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=verification:10m rate=5r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
