# Prometheus scrape configuration for the opt-in observability profile:
#
#   docker compose --profile observability up -d
#
# Alert rules and Grafana dashboards are added in the hardening phase; this file
# records where metrics come from and how long they are retained.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    platform: verifyke

scrape_configs:
  - job_name: verifyke-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: verifyke-api
          tier: application

  # Celery workers expose metrics through celery-exporter when enabled.
  # - job_name: verifyke-worker
  #   static_configs:
  #     - targets: ["celery-exporter:9808"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
