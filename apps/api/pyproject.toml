# The API is installed as an editable package (``pip install -e ".[dev]"``).
# Explicit package discovery is required: a flat-layout auto-discovery refuses
# to build because ``verifyke`` and ``migrations`` both sit at the top level.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verifyke*"]

[project]
name = "verifyke-api"
version = "0.1.0"
description = "VerifyKE API - digital certificate and document verification platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime dependencies. Versions are intentionally ranged; the container build
# resolves and locks them (see infrastructure/docker).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43.0",
    "pyotp>=2.9",
    "redis>=5.0",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "zxcvbn>=4.4.28",
    "uuid6>=2024.7.10",
    "rfc8785>=0.1.4",
    # Document processing / verification (used from Phase 4 onwards)
    "qrcode[pil]>=7.4",
    "reportlab>=4.2",
    "pillow>=10.4",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "python-magic>=0.4.27",
    "boto3>=1.35",
    "celery>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "fakeredis>=2.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL/Redis instance",
    "security: security-focused test cases",
    "slow: long-running test cases",
]
pythonpath = [
    ".",
    "../../packages/security",
    "../../packages/document-processing",
    "../../services/verification",
    "../../services/notifications",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI dependency defaults are function calls by design
    "RUF012", # mutable class attrs are fine for pydantic/SQLAlchemy models
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = [
    "verifyke",
    "verifyke_security",
    "verifyke_document_processing",
    "verifyke_verification",
    "verifyke_notifications",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]