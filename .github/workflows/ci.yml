name: CI

# Gates that must pass before any change reaches main. The suite is split so a
# failure in one area does not hide the others, and so the fast checks report
# within seconds while the heavy jobs run in parallel.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------ backend
  api-quality:
    name: API lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: verifyke
          POSTGRES_PASSWORD: verifyke
          POSTGRES_DB: verifyke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verifyke" --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      VK_APP_ENV: test
      VK_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789
      VK_DATABASE_URL: postgresql+psycopg://verifyke:verifyke@localhost:5432/verifyke
      VK_REDIS_URL: redis://localhost:6379/0
      VK_KEY_PROVIDER: aws_kms
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff (lint + format check)
        run: ruff check . ../../packages/security && ruff format --check . ../../packages/security

      - name: Mypy (type check)
        run: mypy verifyke ../../packages/security/verifyke_security

      - name: Alembic migrations apply cleanly
        run: alembic upgrade head

      - name: Pytest (with coverage gate)
        run: pytest --cov=verifyke --cov=verifyke_security --cov-report=term-missing --cov-fail-under=80

  # ------------------------------------------------------------------ frontend
  web-quality:
    name: Web lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace @verifyke/web --include-workspace-root

      - name: Lint
        run: npm run lint --workspace @verifyke/web

      - name: Type check
        run: npm run typecheck --workspace @verifyke/web

      - name: Unit tests
        run: npm run test --workspace @verifyke/web --if-present

      - name: Build
        run: npm run build --workspace @verifyke/web

  # ------------------------------------------------------------------ containers
  images:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.web
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------ policy
  secrets-scan:
    name: Secret & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must never be committed"; exit 1
          fi
          test -f .env.example

      - name: pip-audit (known vulnerable dependencies)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict --progress-spinner off -r <(python - <<'PY'
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('apps/api/pyproject.toml').read_text())
          print("\n".join(data['project']['dependencies']))
          PY
          )
        shell: bash
